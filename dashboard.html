<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Improved Social Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="logo">
      <i class="fas fa-fire"></i>
      <span>SocialPlus</span>
    </div>

    <nav class="nav-menu">
      <a href="#" class="nav-item active">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-compass"></i>
        <span>Explore</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-bell"></i>
        <span>Notifications</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-envelope"></i>
        <span>Messages</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-bookmark"></i>
        <span>Bookmarks</span>
      </a>
      <a href="#" class="nav-item">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>

    <div class="user-profile">
      
    </div>
    <button class="logout-btn">
      <i class="fas fa-sign-out-alt"></i>
    </button>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="header">
      <h1 class="page-title">Dashboard</h1>
      <div class="header-actions">
        <div class="search-bar">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search...">
        </div>
        <button class="theme-toggle" id="theme-toggle">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>

    <!-- Create Post -->
    <div class="create-post">
      <textarea class="post-input" placeholder="What's on your mind?"></textarea>
      <div class="post-actions">
        <div class="media-buttons">
          <button class="media-btn">
            <i class="fas fa-image"></i>
          </button>
          <input type="file" id="post-upload-input" hidden>
          <div>
            <img src="" class="post-preview" alt="">
          </div>
          <!-- <button class="media-btn">
            <i class="fas fa-video"></i>
          </button>
          <button class="media-btn">
            <i class="fas fa-map-marker-alt"></i>
          </button> -->
        </div>
        <button class="post-btn">Post</button>
      </div>
    </div>

    <!-- Posts Feed -->
    <div class="posts-feed">
     
    </div>
  </main>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/dashboard.js" type="module"></script>
    <!-- <script src="scripts/app.js" type="module"></script> -->
    <script src="backend/backend.js" type="module"></script>
</body>
</html>
